<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кешбекер</title>
<meta name="description" content="Кошелёк банковских карт с кешбеком по категориям">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кешбекер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("keshbeker-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="theme-color" content="#e8ebf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=202611090856">
<script src="js/config.js?v=202611090856"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="splash" role="status" aria-label="Загрузка">
  <div class="sp-stage"><div class="sp-card"><i class="sp-chip"></i><i class="sp-line"></i><b class="sp-pct">%</b></div><div class="sp-shadow"></div></div>
  <div class="sp-name">Кешбекер</div>
  <div class="sp-sub">Достаю карты…</div>
</div>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Кешбекер</h1><span id="monthLbl"></span></div>
    <div class="hdr-r"><button class="btn primary" id="addBtn" type="button"><span aria-hidden="true">+</span> Карта</button><button class="avatar" id="acctBtn" type="button" aria-label="Аккаунт" hidden></button><span id="gateTheme" data-theme-slot hidden></span></div>
  </header>

  <section class="gate" id="gate" hidden>
    <div class="gate-cards" aria-hidden="true"><i><b class="g-pct">10%</b></i><i><b class="g-pct">5%</b></i><i>
      <svg class="g-waves" viewBox="0 0 300 190" preserveAspectRatio="none" fill="none">
        <defs><linearGradient id="gSilver" x1="0" x2="1"><stop offset="0" stop-color="#f1f4f7"/><stop offset="1" stop-color="#7f8894"/></linearGradient>
          <linearGradient id="gChip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset=".5" stop-color="#c9ced6"/><stop offset="1" stop-color="#8b939e"/></linearGradient></defs>
        <path d="M-10 150C60 110 120 190 190 140S290 90 320 120" stroke="url(#gSilver)" stroke-width="1.4" opacity=".9"/>
        <path d="M-10 162C60 122 120 202 190 152S290 102 320 132" stroke="url(#gSilver)" stroke-width="1.2" opacity=".6"/>
        <path d="M-10 174C60 134 120 214 190 164S290 114 320 144" stroke="url(#gSilver)" stroke-width="1" opacity=".35"/>
        <circle cx="262" cy="34" r="60" stroke="url(#gSilver)" stroke-width="1" opacity=".25"/>
      </svg>
      <b class="g-pct">7%</b>
      <svg class="g-chip" viewBox="0 0 40 30"><rect x=".6" y=".6" width="38.8" height="28.8" rx="6" fill="url(#gChip)" stroke="#6c737d" stroke-width=".8"/><g fill="none" stroke="#454b53" stroke-width=".9" stroke-linecap="round"><ellipse cx="20" cy="15" rx="5.2" ry="7.2"/><path d="M20 .8V7.8M20 22.2V29.2M.8 10H11Q14.8 10 15.2 12.2M.8 20H11Q14.8 20 15.2 17.8M39.2 10H29Q25.2 10 24.8 12.2M39.2 20H29Q25.2 20 24.8 17.8"/></g></svg>
      <svg class="g-nfc" viewBox="0 0 24 24" fill="none" stroke="#dfe4ea" stroke-width="2" stroke-linecap="round"><path d="M8 7a7 7 0 0 1 0 10"/><path d="M12 4a11 11 0 0 1 0 16"/><path d="M4 10a3 3 0 0 1 0 4"/></svg>
      <span class="g-lbl">Кешбекер</span>
    </i></div>
    <h2>Все кешбеки в одном кошельке</h2>
    <form class="auth" id="authForm" autocomplete="on">
      <div class="seg" role="tablist" id="authTabs"><button type="button" role="tab" data-mode="in" aria-selected="true">Вход</button><button type="button" role="tab" data-mode="up" aria-selected="false">Регистрация</button></div>
      <input class="in" id="authEmail" type="email" autocomplete="email" required placeholder="Почта" aria-label="Почта">
      <input class="in" id="authPass" type="password" autocomplete="current-password" required minlength="6" placeholder="Пароль" aria-label="Пароль">
      <input class="in" id="authPass2" type="password" autocomplete="new-password" minlength="6" placeholder="Повтори пароль" aria-label="Повтори пароль" hidden>
      <button class="btn primary" id="authSubmit" type="submit">Войти</button>
      <p class="auth-msg" id="authMsg" role="status"></p>
      <button class="alt" type="button" id="forgotBtn">Забыл пароль</button>
    </form>
    <form class="auth" id="resetForm" hidden>
      <p>Придумай новый пароль</p>
      <input class="in" id="newPass" type="password" autocomplete="new-password" required minlength="6" placeholder="Новый пароль" aria-label="Новый пароль">
      <button class="btn primary" type="submit">Сохранить пароль</button>
      <p class="auth-msg" id="resetMsg" role="status"></p>
    </form>
    <button class="alt" type="button" id="guestBtn">Продолжить без входа</button>
    <button class="install-btn" type="button" data-install hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Установить приложение</button>
  </section>
  <div id="main" style="display:contents">
  <nav class="tabs" role="tablist" id="viewTabs" aria-label="Разделы"><span class="tab-glow" aria-hidden="true"></span><span class="tab-pill" aria-hidden="true"></span><button type="button" role="tab" data-view="cards" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>Карты</button><button type="button" role="tab" data-view="shops" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5c0 1.4 1.2 2.5 2.7 2.5s2.6-1.1 2.6-2.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5M10 20v-5h4v5"/></svg>Магазины</button></nav>
  <div id="cardsView" style="display:contents">
  <section class="search" aria-label="Поиск кешбека">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" placeholder="Какой кешбек нужен?" aria-label="Категория или магазин">
      <button id="qClear" type="button" aria-label="Очистить" hidden>×</button>
      <ul class="suggest" id="suggest" role="listbox" aria-label="Подсказки" hidden></ul>
    </div>
    <div class="chips" id="chips"></div>
    <div id="answerBox"></div>
  </section>

  <div class="wallet" id="wallet" aria-label="Карты"></div>
  <div id="detail"></div>
  </div>
  <section id="shopsView" class="shops" hidden>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="shopQ" class="q2" type="search" autocomplete="off" placeholder="Найти продукт" aria-label="Найти продукт">
    </div>
    <ul class="shoplist" id="shopList"></ul>
  </section>
  <button type="button" class="trash-link" id="trashBtn" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Корзина <b id="trashCount">0</b></button>
  <p class="status" id="status"></p>
  </div>
</div>

<script src="js/data.js?v=202611090856"></script>
<script src="js/wallet.js?v=202611090856"></script>
<script src="js/photo.js?v=202611090856"></script>
<script src="js/shops.js?v=202611090856"></script>
<script src="js/editor.js?v=202611090856"></script>
<script src="js/theme.js?v=202611090856"></script>
<script src="js/install.js?v=202611090856"></script>
<script src="js/account.js?v=202611090856"></script>

</body>
</html>

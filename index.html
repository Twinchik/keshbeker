<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кешбекер</title>
<meta name="description" content="Кошелёк банковских карт с кешбеком по категориям">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кешбекер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8ebf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#e8ebf0; --surface:#ffffff; --surface-2:#f3f5f8; --ink:#13161b; --muted:#5d6572; --line:#d6dbe3;
  --accent:#2f5bea; --accent-ink:#ffffff; --good:#18864b; --warn:#b4610c; --shadow:0 1px 2px rgba(20,24,32,.06),0 8px 24px rgba(20,24,32,.08);
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0d0f12; --surface:#171a1f; --surface-2:#1e2228; --ink:#eef1f5; --muted:#98a1ad; --line:#2a3039;
  --accent:#7d9bff; --accent-ink:#0d0f12; --good:#4cc986; --warn:#f0a44b; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0d0f12; --surface:#171a1f; --surface-2:#1e2228; --ink:#eef1f5; --muted:#98a1ad; --line:#2a3039;
  --accent:#7d9bff; --accent-ink:#0d0f12; --good:#4cc986; --warn:#f0a44b; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:#d23c2f;border-color:color-mix(in srgb,#d23c2f 35%,var(--line))}
.btn.danger.armed{background:#d23c2f;color:#fff;border-color:#d23c2f}

.hdr-r{display:flex;align-items:center;gap:8px}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;overflow:hidden;background:var(--surface-2);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:64px;height:64px;cursor:default;display:grid;place-items:center;font-size:26px}
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:24px 8px}
.gate-cards{position:relative;width:min(260px,70vw);aspect-ratio:1.3;margin-bottom:6px}
.gate-cards i{position:absolute;left:0;right:0;aspect-ratio:1.586;border-radius:16px;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.gate-cards i:nth-child(1){top:0;background:linear-gradient(135deg,#3f72f7,#2350d8);transform:rotate(-7deg)}
.gate-cards i:nth-child(2){top:14%;background:linear-gradient(135deg,#aed33f,#6fb43b);transform:rotate(3deg)}
.gate-cards i:nth-child(3){top:28%;background:#161616;transform:rotate(-2deg)}
.gate-cards i:nth-child(3)::after{content:"7%";position:absolute;right:16px;top:12px;color:#fff;font-family:var(--display);font-weight:700;font-size:22px}
.gate h2{font-family:var(--display);font-size:clamp(26px,8vw,34px);margin:0;letter-spacing:-.02em;text-wrap:balance}
.gate p{margin:0;color:var(--muted);max-width:34ch}
.gate .btn{padding:13px 22px;font-size:16px;text-decoration:none}
.gate .alt{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.acct{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.acct strong{font-size:18px}
.acct span{color:var(--muted);font-size:13px}
.sync{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.off::before{background:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button small{font-weight:500;font-size:12px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nextbox{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.nextbox h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nextbox .rows .p{color:var(--muted)}
.nextbox .bar i{background:var(--muted);opacity:.5}
.foot-l{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.foot .ready.no{border-style:dashed;opacity:.65}
.foot .ready{border:1px solid currentColor;border-radius:999px;padding:1px 8px;letter-spacing:.02em;text-transform:none;opacity:.9}
.trash-link{align-self:center;border:0;background:none;color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px}
.trash-link b{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-weight:600;color:var(--ink)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.titem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.titem .mini{width:52px;aspect-ratio:1.586;border-radius:7px;background:var(--c-bg);grid-row:span 2}
.titem strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem span{font-size:12px;color:var(--muted)}
.titem .ta{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;z-index:600;box-shadow:var(--shadow);animation:rise .25s;max-width:calc(100% - 32px);font-size:14px}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{border:0;background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:600}
.card.photo{background:var(--c-bg) center/cover no-repeat}
.card.photo .face{grid-template-columns:1fr}
.card.photo .emv{display:none}
.card.photo .strip,.card.photo .face{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.ph{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.ph-prev{width:100%;aspect-ratio:1.586;border-radius:10px;background:var(--c-bg) center/cover no-repeat;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden}
.ph-prev::after{content:"";position:absolute;inset:0;background:var(--c-sheen)}
.ph-btns{display:flex;flex-wrap:wrap;gap:6px}
.ph-btns .btn{padding:8px 12px;font-size:13px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.ph-btns label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:400px){.ph{grid-template-columns:96px 1fr}}
.tabs{grid-template-columns:1fr 1fr}
.tabs button{flex-direction:row;justify-content:center;font-size:15px;padding:9px 6px}
.shops{display:flex;flex-direction:column;gap:12px}
.q2{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px 13px 42px;font:inherit;font-size:16px;color:var(--ink)}
.shoplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.shop-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shop-h strong{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-h .p{font-family:var(--display);font-weight:700;font-size:20px;color:var(--good);font-variant-numeric:tabular-nums;flex:none}
.offers{display:flex;flex-wrap:wrap;gap:6px}
.offer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
.offer i{width:26px;aspect-ratio:1.586;border-radius:4px;background:var(--c-bg) center/cover;flex:none}
.offer b{font-variant-numeric:tabular-nums}
.offer i.none{background:transparent;border:1.5px dashed var(--muted)}
.offer.add{padding:4px 12px;color:var(--muted);border-style:dashed;background:transparent}
.shops .empty-s{text-align:center;color:var(--muted);padding:28px 12px;border:2px dashed var(--line);border-radius:16px}
.auth{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.auth .in{font-size:16px;padding:12px 13px}
.auth .btn{justify-content:center}
.auth-msg{font-size:13px;min-height:1em;color:var(--muted)}
.auth-msg.err{color:#d23c2f}
.auth-msg.ok{color:var(--good)}
.avatar{font-weight:700;color:var(--ink)}
/* search */
.search{display:flex;flex-direction:column;gap:10px}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 40px 13px 42px;font:inherit;font-size:16px;color:var(--ink)}
#q::placeholder{color:var(--muted)}
#qClear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:baseline}
.chip b{font-variant-numeric:tabular-nums;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.answer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);text-align:left;width:100%}
.answer .pct{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--good);flex:none}
.answer .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.answer .txt small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.answer .txt strong{font-size:16px}
.answer .txt span{color:var(--muted);font-size:13px}
.answer.none .pct{color:var(--muted)}

/* wallet */
.wallet{position:relative;transition:height .55s cubic-bezier(.2,.8,.2,1)}
.card{position:absolute;left:0;top:0;width:100%;aspect-ratio:1.586;border-radius:clamp(14px,4.2vw,20px);
  transform-origin:50% 0;transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .3s,filter .3s;cursor:pointer;
  box-shadow:0 -1px 0 rgba(255,255,255,.08) inset,0 -6px 18px rgba(0,0,0,.18);overflow:hidden;color:var(--c-ink);background:var(--c-bg);
  display:flex;flex-direction:column;user-select:none;-webkit-tap-highlight-color:transparent}
.card::before{content:"";position:absolute;inset:0;background:var(--c-sheen);pointer-events:none}
.card.best{box-shadow:0 0 0 3px var(--good),0 -6px 18px rgba(0,0,0,.18)}
.card.dim{filter:saturate(.35) brightness(.9)}
.strip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 clamp(14px,4.5vw,22px);height:var(--peek)}
.bank{font-family:var(--display);font-weight:700;font-size:clamp(15px,4.6vw,21px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip-r{display:flex;align-items:baseline;gap:6px;flex:none;font-variant-numeric:tabular-nums}
.strip-r .big{font-family:var(--display);font-weight:700;font-size:clamp(16px,4.8vw,22px)}
.strip-r .lbl{font-size:12px;opacity:.85;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-r .tag{font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:1px 7px;opacity:.8}
.face{position:relative;flex:1;display:grid;grid-template-columns:auto 1fr;gap:0 clamp(12px,4vw,20px);padding:4px clamp(14px,4.5vw,22px) clamp(12px,3.5vw,18px);min-height:0}
.emv{width:clamp(34px,10vw,46px);aspect-ratio:1.3;border-radius:7px;background:linear-gradient(135deg,#d9dde2,#a9afb7 45%,#cfd3d8);position:relative;margin-top:6px;opacity:.9}
.emv::before,.emv::after{content:"";position:absolute;inset:28% 0;border-block:1px solid rgba(0,0,0,.28)}
.emv::after{inset:0 38%;border-block:0;border-inline:1px solid rgba(0,0,0,.28)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.4vw,8px) 12px;align-content:start;min-width:0}
.grid li{display:flex;align-items:baseline;gap:6px;min-width:0}
.grid li b{font-family:var(--display);font-weight:700;font-size:clamp(13px,3.9vw,17px);font-variant-numeric:tabular-nums;flex:none}
.grid li span{font-size:clamp(11px,3.2vw,13px);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid li.hit span{text-decoration:underline;text-underline-offset:3px;opacity:1}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;font-size:clamp(11px,3.2vw,13px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85;gap:8px}
.foot .stale{background:rgba(255,255,255,.9);color:#8a4b00;border-radius:999px;padding:2px 8px;letter-spacing:.02em;text-transform:none}
.card.empty{position:relative;border:2px dashed var(--line);background:transparent;color:var(--muted);box-shadow:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:600}
.card.empty::before{display:none}

/* detail */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-family:var(--display);font-size:17px;margin:0;font-weight:700}
.panel-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.row .n{display:flex;gap:8px;align-items:center;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;flex:none}
.row .p{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:0}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:500;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet h3{font-family:var(--display);font-size:18px;margin:0}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>label,.fl>.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.in{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 11px;font:inherit;color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:38px;height:26px;border-radius:6px;border:2px solid transparent;background:var(--c-bg);box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.erow{display:grid;grid-template-columns:1fr 74px 34px;gap:6px;align-items:center}
.erow .x{border:0;background:transparent;color:var(--muted);font-size:20px;height:34px;border-radius:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.acts>div{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted);text-align:center;margin:0}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@media (max-width:400px){.erow{grid-template-columns:1fr 64px 34px}}
@media (prefers-reduced-motion:reduce){.card,.wallet{transition:none}.sheet,.scrim{animation:none}}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Кешбекер</h1><span id="monthLbl"></span></div>
    <div class="hdr-r"><button class="btn primary" id="addBtn" type="button"><span aria-hidden="true">+</span> Карта</button><button class="avatar" id="acctBtn" type="button" aria-label="Аккаунт" hidden></button></div>
  </header>

  <section class="gate" id="gate" hidden>
    <div class="gate-cards" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2>Все кешбеки в одном кошельке</h2>
    <p id="gateText">Войди, и твои карты будут на всех устройствах: на айфоне и на компьютере.</p>
    <form class="auth" id="authForm" autocomplete="on">
      <div class="seg" role="tablist" id="authTabs"><button type="button" role="tab" data-mode="in" aria-selected="true">Вход</button><button type="button" role="tab" data-mode="up" aria-selected="false">Регистрация</button></div>
      <input class="in" id="authEmail" type="email" autocomplete="email" required placeholder="Почта" aria-label="Почта">
      <input class="in" id="authPass" type="password" autocomplete="current-password" required minlength="6" placeholder="Пароль" aria-label="Пароль">
      <input class="in" id="authPass2" type="password" autocomplete="new-password" minlength="6" placeholder="Повтори пароль" aria-label="Повтори пароль" hidden>
      <button class="btn primary" id="authSubmit" type="submit">Войти</button>
      <p class="auth-msg" id="authMsg" role="status"></p>
      <button class="alt" type="button" id="forgotBtn">Забыл пароль</button>
    </form>
    <form class="auth" id="resetForm" hidden>
      <p>Придумай новый пароль</p>
      <input class="in" id="newPass" type="password" autocomplete="new-password" required minlength="6" placeholder="Новый пароль" aria-label="Новый пароль">
      <button class="btn primary" type="submit">Сохранить пароль</button>
      <p class="auth-msg" id="resetMsg" role="status"></p>
    </form>
    <button class="alt" type="button" id="guestBtn">Продолжить без входа</button>
  </section>
  <div id="main" style="display:contents">
  <nav class="seg tabs" role="tablist" id="viewTabs"><button type="button" role="tab" data-view="cards" aria-selected="true">Карты</button><button type="button" role="tab" data-view="shops" aria-selected="false">Магазины</button></nav>
  <div id="cardsView" style="display:contents">
  <section class="search" aria-label="Поиск кешбека">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Что покупаешь? Такси, аптека, Пятёрочка…" aria-label="Категория или магазин">
      <button id="qClear" type="button" aria-label="Очистить" hidden>×</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="answerBox"></div>
  </section>

  <div class="wallet" id="wallet" aria-label="Карты"></div>
  <div id="detail"></div>
  </div>
  <section id="shopsView" class="shops" hidden>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="shopQ" class="q2" type="search" autocomplete="off" placeholder="Найти магазин" aria-label="Найти магазин">
    </div>
    <ul class="shoplist" id="shopList"></ul>
  </section>
  <button type="button" class="trash-link" id="trashBtn" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Корзина <b id="trashCount">0</b></button>
  <p class="status" id="status"></p>
  </div>
</div>

<script>
(() => {
const STYLES = {
  blue:{name:"Синяя",bg:"linear-gradient(135deg,#3f72f7,#2350d8)",ink:"#fff"},
  lime:{name:"Лайм",bg:"linear-gradient(135deg,#aed33f,#6fb43b)",ink:"#15300c"},
  white:{name:"Белая",bg:"linear-gradient(160deg,#fbfcfd,#e8ecf1)",ink:"#1c2c6e"},
  red:{name:"Красная",bg:"linear-gradient(135deg,#e5302a,#c71a14)",ink:"#fff"},
  orange:{name:"Оранжевая",bg:"linear-gradient(100deg,#f8a51c,#f0512a 60%,#e9322b)",ink:"#fff"},
  black:{name:"Чёрная",bg:"#161616",ink:"#ececec",sheen:"radial-gradient(120% 140% at -10% 50%,#050505 0 42%,transparent 42.5%)"},
  violet:{name:"Фиолетовая",bg:"linear-gradient(135deg,#7b4dff,#4d23c9)",ink:"#fff"},
  mint:{name:"Мятная",bg:"linear-gradient(135deg,#34c9a3,#16977b)",ink:"#062a21"},
  graphite:{name:"Графит",bg:"linear-gradient(135deg,#4a515c,#2b3038)",ink:"#f1f3f6"},
  gold:{name:"Золото",bg:"linear-gradient(135deg,#e7c77a,#b38a3a)",ink:"#2b1d05"}
};
const SYN = [
  ["продукт","супермаркет","магнит","пятерочк","перекрест","вкусвилл","лента","ашан","дикси","самокат","лавка"],
  ["кафе","ресторан","фастфуд","кофе","бар","еда вне дома","доставка еды"],
  ["такси","яндекс go","ситимобил"],
  ["азс","топливо","бензин","заправк"],
  ["аптек","здоровье","лекарств","медицин"],
  ["транспорт","метро","автобус","тройка","проезд","электричк"],
  ["одежд","обув","wildberries","вайлдберриз","ozon","озон","маркетплейс","lamoda"],
  ["развлечен","кино","театр","концерт","игр"],
  ["связь","мобильн","интернет"],
  ["красот","салон","косметик","золотое яблоко","летуаль"],
  ["спорт","фитнес","спорттовар"],
  ["дом","ремонт","строй","леруа","икеа","hoff"],
  ["электроник","техник","днс","м.видео","мвидео","эльдорадо"],
  ["книг","образован"],["животн","зоо"],["путешеств","авиа","отел","жд","ржд"]
];
const SHOPS_COMMON = ["Пятёрочка","Перекрёсток","Магнит","ВкусВилл","Лента","Ашан","Самокат","Яндекс Лавка","Ozon","Wildberries","Яндекс Маркет","Ламода","Золотое яблоко","Летуаль","Спортмастер","DNS","М.Видео","Леруа Мерлен","Аптека Ригла","Вкусно — и точка","Шоколадница","Яндекс Go"];
const COMMON = ["Супермаркеты","Кафе и рестораны","Такси","АЗС","Аптеки","Транспорт","Одежда и обувь","Развлечения","Маркетплейсы","Красота","Спорт","Дом и ремонт","Электроника","Фастфуд","Всё остальное"];
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/ё/g,"е").trim();
const fmtP = p => (Math.round(p*10)/10).toString().replace(".",",") + "%";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)).slice(0,12);
const nowMonth = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const addMonth = (m,k=1) => { const [y,mm]=String(m).split("-").map(Number); const d=new Date(y,mm-1+k,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthOnly = m => { const [,mm]=String(m||"").split("-"); return mm ? MONTHS[+mm-1] : ""; };
const cleanP = p => Math.max(0,Math.min(100,+String(p).replace(",",".")||0));
const cleanItems = arr => (arr||[]).filter(i=>String(i.n).trim()).map(i=>({n:String(i.n).trim(),p:cleanP(i.p)}));
// «Всё остальное» — базовый кешбек на любые покупки
const isBase = n => /^(вс[её] остальн|остальн|на вс[её]|все покупки|любые покупки)/.test(norm(n).replace(/ё/g,"е"));
// старые карты хранили магазины среди категорий — переносим их в отдельный список
function normCard(c){
  const shops=[...(c.shops||[])];
  const addShop=it=>{ const i=shops.findIndex(x=>norm(x.n)===norm(it.n)); if(i<0) shops.push({n:it.n,p:it.p}); else if(it.p>shops[i].p) shops[i]={n:it.n,p:it.p}; };
  const strip=arr=>(arr||[]).filter(i=>{ if(i.k==="shop"){ addShop(i); return false; } return true; }).map(i=>({n:i.n,p:i.p}));
  const items=strip(c.items); const next=c.next?{...c.next,items:strip(c.next.items)}:c.next;
  return {...c, items, next, shops};
}
// когда наступает месяц, выбранный заранее, он становится текущим
function rollCard(c){
  if(c.next && c.next.month && c.next.month<=nowMonth()){
    return {...c, month:c.next.month, items:c.next.items||[], next:null, updatedAt:Date.now()};
  }
  return null;
}
const monthName = m => { const [y,mm]=String(m||"").split("-"); return mm ? MONTHS[+mm-1]+" "+y : ""; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let allCards = [];      // все карты, включая те, что в корзине
let cards = [];         // карты в кошельке (без удалённых); {id,bank,label,style,order,month,items:[{n,p,k}],sample,updatedAt}
let selected = null;
let query = "";
let store = null;       // {save(card), remove(id), mode}
let editing = null;

$("#monthLbl").textContent = "Категории на " + monthName(nowMonth());

/* ---------- search ---------- */
function expand(q){
  const nq = norm(q); if(!nq) return [];
  const terms = new Set([nq]);
  for (const g of SYN) if (g.some(t => t.includes(nq) || (nq.length>=3 && nq.includes(t)))) g.forEach(t=>terms.add(t));
  return [...terms];
}
function matches(item, terms){
  const n = norm(item.n);
  return terms.some(t => n.includes(t) || (n.length>=4 && t.includes(n)) || t.split(" ").some(w => w.length>=4 && n.includes(w.slice(0,Math.max(4,w.length-2)))));
}
function rankCard(card, terms){
  let best=null, base=null;
  for (const it of card.items||[]) {
    if (isBase(it.n)) { if(!base || it.p>base.p) base=it; continue; }
    if (matches(it,terms) && (!best || it.p>best.p)) best=it;
  }
  // магазины ищем по точному названию, без синонимов: «пятёрочка» не должна находить «Самокат»
  for (const sh of card.shops||[]) if (matches(sh,[terms[0]]) && (!best || sh.p>best.p)) best={...sh, shop:true};
  if (best) return {p:best.p, item:best, base:false};
  if (base) return {p:base.p, item:base, base:true};
  return {p:0, item:null, base:true};
}
function ranking(){
  const terms = expand(query); if(!terms.length) return null;
  const r = cards.map(c => ({card:c, ...rankCard(c,terms)}));
  r.sort((a,b)=> (a.base-b.base) || (b.p-a.p));
  return {terms, list:r};
}

/* ---------- render ---------- */
const PHOTO_SHEEN="linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.12) 38%,rgba(0,0,0,.12) 62%,rgba(0,0,0,.6))";
// у карты с фото фон — само фото, поверх лёгкое затемнение, чтобы читались проценты
function cardVars(c){ return c.photo ? `--c-bg:url(${c.photo});--c-ink:#fff;--c-sheen:${PHOTO_SHEEN}` : styleVars(c.style); }
function styleVars(st){ const s=STYLES[st]||STYLES.graphite; return `--c-bg:${s.bg};--c-ink:${s.ink};--c-sheen:${s.sheen||"radial-gradient(90% 120% at 110% -10%,rgba(255,255,255,.18),transparent 60%)"}`; }
function topItems(card){ return [...(card.items||[])].sort((a,b)=>b.p-a.p); }

function renderChips(){
  const m = new Map();
  for (const c of [...cards, looseDoc()]) for (const it of [...(c.items||[]),...(c.shops||[])]) { if(isBase(it.n)) continue; const k=norm(it.n); const cur=m.get(k); if(!cur||it.p>cur.p) m.set(k,{n:it.n,p:it.p}); }
  const list=[...m.values()].sort((a,b)=>b.p-a.p).slice(0,18);
  $("#chips").innerHTML = list.map(x=>`<button type="button" class="chip${norm(x.n)===norm(query)?" on":""}" data-q="${esc(x.n)}">${esc(x.n)} <b>${fmtP(x.p)}</b></button>`).join("");
  $("#chips").hidden = !list.length;
}

function renderAnswer(rk){
  const box=$("#answerBox");
  if(!rk){ box.innerHTML=""; return; }
  const loose=(looseDoc().shops||[]).filter(sh=>matches(sh,[rk.terms[0]])).sort((a,b)=>b.p-a.p)[0];
  const extra = loose ? `<p class="note" style="margin:8px 0 0">В самом магазине «${esc(loose.n)}» свой кешбек ${fmtP(loose.p)}, без карты.</p>` : "";
  const top=rk.list[0];
  if(!top){ box.innerHTML=""; return; }
  if(top.base){
    box.innerHTML = top.item
      ? `<button type="button" class="answer none" data-id="${top.card.id}"><span class="pct">${fmtP(top.p)}</span><span class="txt"><small>Нет такой категории</small><strong>${esc(top.card.bank)}</strong><span>лучший кешбек на «Всё остальное»</span></span></button>`
      : `<div class="answer none"><span class="pct">0%</span><span class="txt"><small>Ничего не нашлось</small><strong>«${esc(query)}» нет ни на одной карте</strong><span>Добавь категорию в карту, магазин во вкладке «Магазины» или проверь название</span></span></div>`;
    box.innerHTML += extra;
    return;
  }
  const second = rk.list[1] && !rk.list[1].base ? ` · следом ${esc(rk.list[1].card.bank)} ${fmtP(rk.list[1].p)}` : "";
  box.innerHTML = `<button type="button" class="answer" data-id="${top.card.id}"><span class="pct">${fmtP(top.p)}</span><span class="txt"><small>Плати этой картой</small><strong>${esc(top.card.bank)}</strong><span>${esc(top.item.n)}${top.item.shop?" · магазин":""}${second}</span></span></button>` + extra;
}

function cardHTML(c, rk, isBest){
  const r = rk && rk.list.find(x=>x.card.id===c.id);
  const items = topItems(c);
  const maxP = items.length ? items[0].p : 0;
  let right;
  if (r) right = r.item ? `<span class="lbl">${esc(r.base?"всё остальное":r.item.n)}</span><span class="big">${fmtP(r.p)}</span>` : `<span class="lbl">нет</span>`;
  else right = items.length ? `<span class="lbl">${items.filter(i=>!isBase(i.n)).length} кат.</span><span class="big">до ${fmtP(maxP)}</span>` : `<span class="tag">пусто</span>`;
  const shown = items.slice(0,6);
  const hitSet = r && r.item && !r.item.shop ? r.item : null;
  const stale = c.month && c.month!==nowMonth();
  return `<div class="strip"><span class="bank">${esc(c.bank||"Карта")}</span><span class="strip-r">${right}</span></div>
  <div class="face"><div class="emv" aria-hidden="true"></div>
    <ul class="grid">${shown.map(it=>`<li class="${it===hitSet?"hit":""}"><b>${fmtP(it.p)}</b><span>${esc(it.n)}</span></li>`).join("") || `<li><span>Нажми «Изменить», чтобы добавить кешбек</span></li>`}${items.length>6?`<li><span>ещё ${items.length-6}…</span></li>`:""}</ul>
    <div class="foot"><span class="foot-l">${c.next&&c.next.month===addMonth(nowMonth())?`<span class="ready">${esc(monthOnly(c.next.month))} готов</span>`:`<span class="ready no">${esc(monthOnly(addMonth(nowMonth())))} не выбран</span>`}${c.label?`<span>${esc(c.label)}</span>`:""}</span>${stale?`<span class="stale">за ${esc(monthName(c.month))}</span>`:`<span>${esc(monthName(c.month))}</span>`}</div>
  </div>`;
}

let lastOrder = [];
function render(){
  if(view==="shops") renderShops();
  const rk = ranking();
  renderChips(); renderAnswer(rk);
  const tn=allCards.filter(c=>c.deletedAt).length; $("#trashBtn").hidden=!tn; $("#trashCount").textContent=tn;
  $("#qClear").hidden = !query;
  const wallet=$("#wallet");
  if(!cards.length){
    wallet.style.height="auto";
    wallet.innerHTML=`<button type="button" class="card empty" id="emptyAdd">Добавь первую карту — банк, цвет и кешбек по категориям на месяц</button>`;
    $("#detail").innerHTML=""; return;
  }
  wallet.querySelector(".empty")?.remove();
  const ordered = rk ? rk.list.map(x=>x.card) : [...cards].sort((a,b)=>(a.order??0)-(b.order??0));
  // stack: best match goes to the front (last = fully visible)
  const stack = rk ? [...ordered].reverse() : ordered;
  const bestId = rk && rk.list[0] && !rk.list[0].base ? rk.list[0].card.id : null;
  const seen = new Set();
  for (const c of stack){
    seen.add(c.id);
    let el = wallet.querySelector(`[data-card="${c.id}"]`);
    if(!el){ el=document.createElement("div"); el.className="card"; el.dataset.card=c.id; el.tabIndex=0; el.setAttribute("role","button"); wallet.appendChild(el); el.style.transform=`translateY(${wallet.offsetHeight||0}px)`; }
    el.classList.toggle("photo", !!c.photo);
    el.setAttribute("style", cardVars(c) + (el.style.transform?`;transform:${el.style.transform}`:""));
    el.setAttribute("aria-label", `${c.bank}. ${selected===c.id?"Убрать обратно":"Достать карту"}`);
    el.innerHTML = cardHTML(c, rk, c.id===bestId);
    el.classList.toggle("best", c.id===bestId && !selected);
    const rr = rk && rk.list.find(x=>x.card.id===c.id);
    el.classList.toggle("dim", !!(rk && rr && rr.base && bestId));
  }
  wallet.querySelectorAll("[data-card]").forEach(el=>{ if(!seen.has(el.dataset.card)) el.remove(); });
  if (selected && !cards.some(c=>c.id===selected)) selected=null;
  layout(stack);
  renderDetail();
}

let currentStack=[];
function layout(stack=currentStack, animateId=null){
  currentStack=stack;
  const wallet=$("#wallet"); const W=wallet.clientWidth; if(!W) return;
  const H=W/1.586, peek=Math.round(Math.min(64,Math.max(48,W*.135)));
  wallet.style.setProperty("--peek",peek+"px");
  const pos={};
  if(!selected){
    stack.forEach((c,i)=>pos[c.id]={y:i*peek,s:1,z:i+1});
    wallet.style.height=((stack.length-1)*peek+H)+"px";
  } else {
    const rest=stack.filter(c=>c.id!==selected);
    pos[selected]={y:0,s:1,z:200};
    const gap=22, step=Math.max(14,Math.min(26,W*.05));
    rest.forEach((c,j)=>pos[c.id]={y:H+gap+j*step, s:.94, z:j+1});
    wallet.style.height=(rest.length? H+gap+(rest.length-1)*step+peek*.9 : H)+"px";
  }
  wallet.style.clipPath = selected ? "inset(-400px -80px 0 -80px)" : "none";
  wallet.querySelectorAll("[data-card]").forEach(el=>{
    const p=pos[el.dataset.card]; if(!p) return;
    const to=`translateY(${p.y}px) scale(${p.s})`;
    if(animateId===el.dataset.card && !reduce){
      const from=getComputedStyle(el).transform;
      const lift=`translateY(${Math.max(-40, (parseFloat(from.split(",")[5])||0)-70)}px) translateX(8%) rotate(-3deg) scale(1.04)`;
      el.style.transition="none"; el.style.zIndex=p.z; el.style.transform=to;
      el.animate([{transform:from==="none"?"none":from},{transform:lift,offset:.42},{transform:to}],{duration:720,easing:"cubic-bezier(.2,.75,.2,1)"}).onfinish=()=>{el.style.transition="";};
    } else {
      el.style.zIndex=p.z; el.style.transform=to;
    }
  });
}

function renderDetail(){
  const box=$("#detail");
  const c=cards.find(x=>x.id===selected);
  if(!c){
    box.innerHTML=`<p class="hint">Нажми на карту, чтобы достать её. Ищи категорию сверху — лучшая карта встанет вперёд.</p>`;
    return;
  }
  const items=topItems(c); const max=Math.max(10,...items.map(i=>i.p));
  const stale=c.month && c.month!==nowMonth();
  const upd=c.updatedAt? relTime(c.updatedAt):"";
  box.innerHTML=`<div class="panel">
    <div class="panel-h"><div><h2>${esc(c.bank)}</h2><p>${esc(monthName(c.month))}${upd?" · обновлено "+upd:""}</p></div>
      <div style="display:flex;gap:8px"><button class="btn" type="button" data-edit="${c.id}">Изменить</button><button class="btn ghost" type="button" data-close>Убрать</button></div></div>
    ${stale?`<p class="note" style="color:var(--warn)">Категории за ${esc(monthName(c.month))}. Начался новый месяц — обнови кешбек.</p>`:""}
    <ul class="rows">${rowsHTML(items,max)}</ul>
    ${c.next ? `<div class="nextbox"><h4><span>С 1 ${esc(genMonth(c.next.month))}</span><button class="btn" type="button" data-editnext="${c.id}">Изменить</button></h4><ul class="rows">${rowsHTML(topItems({items:c.next.items}),max)}</ul></div>`
      : `<div class="nextbox"><h4><span>${esc(cap(monthOnly(addMonth(nowMonth()))))} ещё не выбран</span><button class="btn" type="button" data-editnext="${c.id}">Выбрать</button></h4>${new Date().getDate()>=20?`<p class="note" style="margin:0">Конец месяца — самое время выбрать категории на ${esc(monthOnly(addMonth(nowMonth())))}. Они включатся сами 1-го числа.</p>`:""}</div>`}
  </div>`;
}
const cap = t => t ? t[0].toUpperCase()+t.slice(1) : t;
const GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const genMonth = m => { const [,mm]=String(m||"").split("-"); return mm ? GEN[+mm-1] : ""; };
function rowsHTML(items,max){ return items.map(it=>`<li class="row"><span class="n"><span>${esc(it.n)}</span></span><span class="p">${fmtP(it.p)}</span><span class="bar"><i style="width:${Math.min(100,it.p/max*100)}%"></i></span></li>`).join("") || `<li class="hint">Кешбек пока не добавлен</li>`; }
function relTime(ts){
  const d=new Date(ts), n=new Date(); const days=Math.floor((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);
  if(days<=0) return "сегодня"; if(days===1) return "вчера"; return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
}

/* ---------- interactions ---------- */
function toggleCard(id){
  const prev=selected;
  selected = selected===id ? null : id;
  document.querySelectorAll("[data-card]").forEach(el=>el.classList.toggle("best", false));
  layout(currentStack, selected?id:null);
  if(!selected && prev) render(); else renderDetail();
  if(selected) $("#wallet").scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});
}
$("#wallet").addEventListener("click",e=>{
  if(e.target.closest("#emptyAdd")) return openEditor(null);
  const el=e.target.closest("[data-card]"); if(el) toggleCard(el.dataset.card);
});
$("#wallet").addEventListener("keydown",e=>{ const el=e.target.closest("[data-card]"); if(el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggleCard(el.dataset.card);} });
$("#detail").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed) return openEditor(cards.find(c=>c.id===ed.dataset.edit));
  const en=e.target.closest("[data-editnext]"); if(en) return openEditor(cards.find(c=>c.id===en.dataset.editnext),"next");

$("#chips").addEventListener("click",e=>{ const b=e.target.closest("[data-q]"); if(!b) return; query = norm(query)===norm(b.dataset.q) ? "" : b.dataset.q; $("#q").value=query; selected=null; render(); });

/* ---------- магазины ---------- */
let view="cards";
function setView(v){
  view=v;
  $("#viewTabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  $("#cardsView").style.display = v==="cards" ? "contents" : "none";
  $("#shopsView").hidden = v!=="shops";
  $("#addBtn").innerHTML = v==="cards" ? '<span aria-hidden="true">+</span> Карта' : '<span aria-hidden="true">+</span> Магазин';
  if(v==="shops") renderShops(); else render();
}
$("#viewTabs").addEventListener("click",e=>{ const b=e.target.closest("[data-view]"); if(b) setView(b.dataset.view); });
function shopGroups(){
  const m=new Map();
  for(const c of [...cards, looseDoc()]) for(const sh of c.shops||[]){
    const k=norm(sh.n); if(!m.has(k)) m.set(k,{n:sh.n,offers:[]});
    m.get(k).offers.push({card:c,p:sh.p,n:sh.n});
  }
  const list=[...m.values()]; list.forEach(g=>g.offers.sort((a,b)=>b.p-a.p));
  return list.sort((a,b)=>b.offers[0].p-a.offers[0].p || a.n.localeCompare(b.n,"ru"));
}
function renderShops(){
  const q=norm($("#shopQ").value);
  const all=shopGroups(); const list=all.filter(g=>!q||norm(g.n).includes(q));
  const box=$("#shopList");
  if(!all.length){ box.innerHTML=`<li class="empty-s">Здесь будут магазины с повышенным кешбеком, например «Пятёрочка — 10% по Т-Банку». Нажми «+ Магазин».</li>`; return; }
  if(!list.length){ box.innerHTML=`<li class="empty-s">«${esc($("#shopQ").value)}» не найден. <button type="button" class="btn" data-newshop="${esc($("#shopQ").value)}" style="margin-top:10px">Добавить магазин</button></li>`; return; }
  box.innerHTML=list.map(g=>`<li class="shop"><div class="shop-h"><strong>${esc(g.n)}</strong><span class="p">${fmtP(g.offers[0].p)}</span></div>
    <div class="offers">${g.offers.map(o=>`${o.card.id===LOOSE_ID
        ? `<button type="button" class="offer" data-shop="${esc(o.n)}" data-card="${LOOSE_ID}" aria-label="Изменить: без карты ${fmtP(o.p)}"><i class="none"></i>Без карты <b>${fmtP(o.p)}</b></button>`
        : `<button type="button" class="offer" data-shop="${esc(o.n)}" data-card="${o.card.id}" aria-label="Изменить: ${esc(o.card.bank)} ${fmtP(o.p)}"><i style="${cardVars(o.card)}"></i>${esc(o.card.bank)} <b>${fmtP(o.p)}</b></button>`}`).join("")}
      <button type="button" class="offer add" data-newshop="${esc(g.n)}">+ карта</button></div></li>`).join("");
}
$("#shopQ").addEventListener("input",renderShops);
$("#shopList").addEventListener("click",e=>{
  const o=e.target.closest(".offer[data-card]"); if(o) return openShop(o.dataset.shop,o.dataset.card);
  const n=e.target.closest("[data-newshop]"); if(n) return openShop(n.dataset.newshop,null,true);
});
function openShop(name, cardId, isNew=!cardId){
  const card=cardId===LOOSE_ID ? looseDoc() : cards.find(c=>c.id===cardId);
  const cur=card ? (card.shops||[]).find(x=>norm(x.n)===norm(name)) : null;
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  const used=new Set([...cards, looseDoc()].filter(c=>(c.shops||[]).some(x=>norm(x.n)===norm(name||""))).map(c=>c.id));
  const firstFree=cards.find(c=>!used.has(c.id)) || (cards.length && used.has(LOOSE_ID) ? cards[0] : looseDoc());
  s.innerHTML=`<form class="sheet" id="shForm" autocomplete="off" role="dialog" aria-modal="true" aria-label="Магазин">
    <h3>${isNew?"Новый магазин":"Изменить магазин"}</h3>
    <div class="fl"><label for="shName">Магазин</label><input class="in" id="shName" required maxlength="40" list="shopNames" placeholder="Пятёрочка"></div>
    <datalist id="shopNames">${[...new Set([...shopGroups().map(g=>g.n),...SHOPS_COMMON])].map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="two">
      <div class="fl"><label for="shCard">Карта</label><select class="in" id="shCard"><option value="${LOOSE_ID}">Без карты</option>${cards.map(c=>`<option value="${c.id}">${esc(c.bank)}${c.label?" · "+esc(c.label):""}</option>`).join("")}</select></div>
      <div class="fl"><label for="shP">Кешбек, %</label><input class="in" id="shP" inputmode="decimal" required placeholder="10"></div>
    </div>
    <div class="acts"><div>${isNew?"":`<button type="button" class="btn danger" id="shDel">Удалить</button>`}</div>
      <div><button type="button" class="btn ghost" id="shCancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div></div>
  </form>`;
  document.body.appendChild(s);
  $("#shName").value = name||""; $("#shCard").value = (card||firstFree)?.id||""; $("#shP").value = cur ? String(cur.p).replace(".",",") : "";
  setTimeout(()=>(name?$("#shP"):$("#shName")).focus(),50);
  const close=()=>s.remove();
  s.addEventListener("click",e=>{ if(e.target===s) close(); });
  s.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  $("#shCancel").onclick=close;
  const without=(c,n)=>({...c, shops:(c.shops||[]).filter(x=>norm(x.n)!==norm(n)), updatedAt:Date.now()});
  if($("#shDel")) $("#shDel").onclick=async()=>{ close(); const u=without(card,name); putCard(u); renderShops(); await store.save(u); };
  $("#shForm").onsubmit=async e=>{ e.preventDefault();
    const n=$("#shName").value.trim(); if(!n) return; const p=cleanP($("#shP").value); const tid=$("#shCard").value;
    close();
    const writes=[];
    if(card && card.id!==tid){ const u=without(card,name); putCard(u); writes.push(u); }
    else if(card && norm(name)!==norm(n)){ const u=without(card,name); putCard(u); }
    const target= tid===LOOSE_ID ? looseDoc() : allCards.find(c=>c.id===tid); if(!target) return;
    const t=without(target,n); t.shops.push({n,p}); putCard(t); writes.push(t);
    renderShops(); for(const w of writes) await store.save(w);
  };
}

const curRows=()=> tab==="next" ? editing.next.items : editing.items;
// фото обрезается по пропорциям банковской карты и сжимается, чтобы влезть в хранилище
async function makePhoto(file){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch{ src=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const sw=src.width, sh=src.height; if(!sw||!sh) throw new Error("empty");
  let W=800, out="";
  for(let q=.8; ; q-=.1){
    const H=Math.round(W/1.586), cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const k=Math.max(W/sw,H/sh), dw=sw*k, dh=sh*k;
    cv.getContext("2d").drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
    out=cv.toDataURL("image/jpeg",q);
    if(out.length<160000 || q<.45){ if(out.length<160000) break; W=Math.round(W*.75); q=.8; if(W<320) break; }
  }
  return out;
}
function drawRows(){
  $("#edRows").innerHTML=curRows().map((it,i)=>`<div class="erow" data-i="${i}">
    <input class="in" data-f="n" id="edN${i}" list="commonCats" placeholder="Категория" value="${esc(it.n)}" aria-label="Название">
    <input class="in" data-f="p" id="edP${i}" inputmode="decimal" value="${esc(String(it.p).replace(".",","))}" aria-label="Процент">
    <button type="button" class="x" data-rm="${i}" aria-label="Удалить строку">×</button></div>`).join("");
  $("#edRows").onclick=e=>{const b=e.target.closest("[data-rm]"); if(!b)return; syncRows(); curRows().splice(+b.dataset.rm,1); if(tab==="next") editing.next.draft=false; drawRows();};
}
function syncRows(){
  const rows=curRows(); let changed=false;
  $("#edRows").querySelectorAll(".erow").forEach(r=>{ const it=rows[+r.dataset.i]; if(!it)return;
    const n=r.querySelector("[data-f=n]").value, p=String(r.querySelector("[data-f=p]").value).replace(",",".");
    if(n!==it.n||p!==String(it.p)) changed=true; it.n=n; it.p=p; });
  if(tab==="next" && changed) editing.next.draft=false;
}
function closeEditor(){ $("#scrim")?.remove(); editing=null; }

// магазины без карты хранятся отдельной записью "_shops" рядом с картами
const LOOSE_ID="_shops";
const looseDoc=()=>allCards.find(c=>c.id===LOOSE_ID) || {id:LOOSE_ID, kind:"shops", items:[], shops:[]};
function setAll(list){
  allCards=(list||[]).map(normCard);
  cards=allCards.filter(c=>!c.deletedAt && c.id!==LOOSE_ID);
}
function putCard(c){ const i=allCards.findIndex(x=>x.id===c.id); const l=[...allCards]; if(i>=0) l[i]=c; else l.push(c); setAll(l); writeLS(allCards); }
function applyRoll(){
  setAll(allCards.map(c=>{ if(c.deletedAt) return c; const r=rollCard(c); if(r){ store?.save(r); return r; } return c; }));
}
async function trashCard(id){
  const c=allCards.find(x=>x.id===id); if(!c) return;
  const d={...c, deletedAt:Date.now()};
  if(selected===id) selected=null;
  putCard(d); render(); toast(`${c.bank} в корзине`, "Вернуть", ()=>restoreCard(id));
  await store.save(d);
}
async function restoreCard(id){
  const c=allCards.find(x=>x.id===id); if(!c) return;
  const r={...c}; delete r.deletedAt; r.deletedAt=null;
  putCard(r); render(); await store.save(r);
}
async function purgeCard(id){ setAll(allCards.filter(c=>c.id!==id)); writeLS(allCards); render(); await store.remove(id); }
let toastT;
function toast(text, act, fn){
  document.querySelector(".toast")?.remove(); clearTimeout(toastT);
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  const sp=document.createElement("span"); sp.textContent=text; t.appendChild(sp);
  if(act){ const b=document.createElement("button"); b.type="button"; b.textContent=act; b.onclick=()=>{ t.remove(); fn(); }; t.appendChild(b); }
  document.body.appendChild(t); toastT=setTimeout(()=>t.remove(),6000);
}
function openTrash(){
  document.querySelector(".toast")?.remove();
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  const draw=()=>{
    const del=allCards.filter(c=>c.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);
    s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Корзина">
      <h3>Корзина</h3>
      <p class="note" style="margin:0">Удалённые карты лежат здесь, пока ты сам не удалишь их навсегда.</p>
      ${del.length?`<ul class="tlist">${del.map(c=>{
        return `<li class="titem"><span class="mini" style="${cardVars(c)};background-size:cover;background-position:center"></span><strong>${esc(c.bank)}${c.label?" · "+esc(c.label):""}</strong>
        <span>Удалена ${esc(relTime(c.deletedAt))}</span>
        <span class="ta"><button type="button" class="btn danger" data-purge="${c.id}">Удалить навсегда</button><button type="button" class="btn primary" data-restore="${c.id}">Восстановить</button></span></li>`; }).join("")}</ul>`
      : `<p class="hint">Корзина пуста</p>`}
      <div class="acts"><div></div><div><button type="button" class="btn ghost" data-x>Закрыть</button></div></div></div>`;
  };
  draw(); document.body.appendChild(s);
  s.addEventListener("click",async e=>{
    if(e.target===s||e.target.closest("[data-x]")) return s.remove();
    const r=e.target.closest("[data-restore]"); if(r){ await restoreCard(r.dataset.restore); toast("Карта вернулась в кошелёк"); draw(); if(!allCards.some(c=>c.deletedAt)) s.remove(); return; }
    const p=e.target.closest("[data-purge]"); if(p){
      if(!p.classList.contains("armed")){ p.classList.add("armed"); p.textContent="Точно? Вернуть будет нельзя"; return; }
      await purgeCard(p.dataset.purge); draw(); }
  });
  s.addEventListener("keydown",e=>{ if(e.key==="Escape") s.remove(); });
}
$("#trashBtn").addEventListener("click",openTrash);

    <div class="acct"><span class="avatar big" id="bigAv"></span><strong id="acctName"></strong><span id="acctSub"></span></div>
    <p class="sync${account.synced?"":" off"}">${account.synced?`Синхронизировано · ${cards.length} ${plural(cards.length,["карта","карты","карт"])}`:"Карты хранятся только в этом браузере"}</p>
    <p class="note">${account.synced?"Твои карты видны только тебе, на любом устройстве, где ты вошёл. Если выйти, карты пропадут с этого устройства, но останутся в аккаунте — после входа они вернутся.":"Войди или зарегистрируйся, чтобы карты не потерялись и были на всех устройствах. Карты, добавленные без входа, можно перенести через «Сохранить в файл» и «Загрузить из файла»."}</p>
    <div class="acts"><div><button type="button" class="btn" id="exportBtn">Сохранить в файл</button><label class="btn" for="importFile">Загрузить из файла<input class="vh" id="importFile" type="file" accept="application/json,.json"></label></div></div>
    <div class="acts"><div>${account.synced?`<button type="button" class="btn danger" id="signOut">Выйти</button>`:`<button type="button" class="btn primary" id="toLogin">Войти</button>`}</div><div><button type="button" class="btn ghost" id="acctClose">Закрыть</button></div></div>
  </div>`;
  document.body.appendChild(s);
  $("#acctName").textContent = account.synced ? (v?.email||"Твой аккаунт") : "Гость";
  $("#acctSub").textContent = account.synced ? "Аккаунт Кешбекера" : "Ты не вошёл в аккаунт";
  $("#bigAv").textContent = account.synced ? (v?.email||"?")[0].toUpperCase() : "?";
  s.addEventListener("click",e=>{ if(e.target===s||e.target.id==="acctClose") s.remove();
    if(e.target.id==="signOut"){ s.remove(); signOut(); }
    if(e.target.id==="toLogin"){ s.remove(); loginFromGuest(); }
    if(e.target.id==="exportBtn") exportCards(); });
  $("#importFile").onchange=async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; s.remove(); await importCards(f); };
  s.addEventListener("keydown",e=>{ if(e.key==="Escape") s.remove(); });
});
const plural=(n,f)=>f[(n%10===1&&n%100!==11)?0:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?1:2];

/* ---------- storage ---------- */
const LS="cashback-wallet-cache-v2";
const readLS=()=>{ try{ return JSON.parse(localStorage.getItem(LS)||"null"); }catch{ return null; } };
const writeLS=v=>{ try{ localStorage.setItem(LS,JSON.stringify(v)); }catch{} };
const setStatus=t=>$("#status").textContent=t;

const cached=readLS(); if(Array.isArray(cached)){ setAll(cached); }
render();

const SO="cashbacker-signedout", GUEST="cashbacker-guest";
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch{ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch{} };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch{} };
let unsub=null, sb=null, session=null;
const CFG=window.KESHBEKER_CONFIG||{};

// таблица cards: одна строка = одна карта пользователя (id, user_id, data)
function makeCol(){
  const uid=session.user.id;
  return {
    doc:id=>({
      set:async c=>{ const {error}=await sb.from("cards").upsert({id, user_id:uid, data:c, updated_at:new Date().toISOString()}); if(error) throw error; },
      delete:async()=>{ const {error}=await sb.from("cards").delete().eq("user_id",uid).eq("id",id); if(error) throw error; }
    }),
    onSnapshot:(cb,err)=>{
      let alive=true;
      const pull=async()=>{ if(!alive) return; const {data,error}=await sb.from("cards").select("id,data").eq("user_id",uid);
        if(error){ err&&err(error); return; } if(alive) cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))}); };
      pull();
      // обновляемся, когда приложение снова открыли, и раз в минуту
      const onVis=()=>{ if(document.visibilityState==="visible") pull(); };
      document.addEventListener("visibilitychange",onVis); const t=setInterval(pull,60000);
      return ()=>{ alive=false; document.removeEventListener("visibilitychange",onVis); clearInterval(t); };
    }
  };
}
function startSynced(){
  lsDel(GUEST);
  account={viewer:{email:session.user.email}, synced:true}; drawAvatar(); showGate(false); setStatus("");
  const col=makeCol();
  store={
    save:async c=>{ writeLS(allCards); try{ await col.doc(c.id).set(c); setStatus(""); }catch(e){ setStatus("Не сохранилось: "+(e?.message||"нет связи")+". Попробуй ещё раз."); } },
    remove:async id=>{ writeLS(allCards); try{ await col.doc(id).delete(); }catch(e){ setStatus("Не удалилось: "+(e?.message||"нет связи")); } }
  };
  render();
  unsub=col.onSnapshot(snap=>{
    setAll(snap.docs.map(d=>({...d.data(),id:d.id})));
    mergeGuest();
    applyRoll(); writeLS(allCards);
    if(editing) return; render();
  }, e=>setStatus("Нет связи с базой: "+(e.message||e)+". Проверь интернет или VPN."));
}
// карты, добавленные в гостевом режиме, переносятся в аккаунт при входе
let pendingMerge=null;
function mergeGuest(){
  if(!pendingMerge) return;
  const have=new Set(allCards.map(c=>c.id)); const add=pendingMerge.filter(c=>!have.has(c.id)); pendingMerge=null;
  let n=0;
  for(const c of add){ putCard(c); store.save(c); if(c.id!==LOOSE_ID && !c.deletedAt) n++; }
  if(n) toast("Перенесено карт из гостевого режима: "+n);
}
function loginFromGuest(){
  $("#authForm").hidden=false; $("#resetForm").hidden=true; setAuthMode("in");
  showGate(true); setTimeout(()=>$("#authEmail").focus(),50);
}
function startGuest(){
  lsSet(GUEST,"1");
  account={viewer:null, synced:false}; drawAvatar(); showGate(false);
  store={ save:async()=>writeLS(allCards), remove:async()=>writeLS(allCards) };
  applyRoll(); writeLS(allCards); render();
  setStatus("Без входа карты хранятся только в этом браузере.");
}
async function signOut(){
  unsub?.(); unsub=null; store=null;
  lsDel(GUEST); lsDel(LS);
  setAll([]); selected=null; query=""; $("#q").value="";
  account={viewer:null, synced:false};
  render(); showGate(true); setStatus("");
  try{ await sb?.auth.signOut(); }catch{}
  session=null;
  toast("Ты вышел из Кешбекера");
}

/* ---------- вход и регистрация ---------- */
let authMode="in";
function setAuthMode(m){
  authMode=m;
  $("#authTabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  $("#authPass2").hidden = m!=="up"; $("#authPass2").required = m==="up";
  $("#authPass").autocomplete = m==="up" ? "new-password" : "current-password";
  $("#authSubmit").textContent = m==="up" ? "Зарегистрироваться" : "Войти";
  $("#forgotBtn").hidden = m==="up"; authMsg("");
}
function authMsg(t,kind){ const el=$("#authMsg"); el.textContent=t; el.className="auth-msg"+(kind?" "+kind:""); }
const ERR={
  "Invalid login credentials":"Неверная почта или пароль.",
  "Email not confirmed":"Почта ещё не подтверждена. Открой письмо от Кешбекера и нажми на ссылку.",
  "User already registered":"Такая почта уже зарегистрирована. Войди или восстанови пароль."
};
function ruErr(e){
  const m=e?.message||"";
  if(ERR[m]) return ERR[m];
  if(/password/i.test(m)) return "Пароль слишком простой: нужно минимум 6 символов.";
  if(/rate limit/i.test(m)) return "Слишком много попыток. Подожди пару минут.";
  if(/fetch|network/i.test(m) || !m) return "Нет связи с сервером. Проверь интернет или включи VPN.";
  return "Не получилось: "+m;
}
$("#authTabs").addEventListener("click",e=>{ const b=e.target.closest("[data-mode]"); if(b) setAuthMode(b.dataset.mode); });
$("#authForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!sb) return authMsg("Сайт ещё не подключён к базе. Заполни config.js.","err");
  const email=$("#authEmail").value.trim(), pass=$("#authPass").value;
  if(authMode==="up" && pass!==$("#authPass2").value) return authMsg("Пароли не совпадают.","err");
  const btn=$("#authSubmit"); btn.disabled=true; authMsg(authMode==="up"?"Регистрирую…":"Вхожу…");
  try{
    if(authMode==="up"){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error) throw error;
      if(!data.session) authMsg("Готово! Мы отправили письмо на "+email+". Открой его и нажми на ссылку, чтобы подтвердить почту.","ok");
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
    }
  }catch(err){ authMsg(ruErr(err),"err"); }
  btn.disabled=false;
});
$("#forgotBtn").addEventListener("click",async()=>{
  const email=$("#authEmail").value.trim();
  if(!email) return authMsg("Впиши почту, и я пришлю ссылку для смены пароля.","err");
  if(!sb) return;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  authMsg(error?ruErr(error):"Письмо со ссылкой для смены пароля отправлено на "+email+".", error?"err":"ok");
});
$("#resetForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const {error}=await sb.auth.updateUser({password:$("#newPass").value});
  const m=$("#resetMsg"); m.textContent=error?ruErr(error):"Пароль изменён"; m.className="auth-msg "+(error?"err":"ok");
  if(!error){ $("#resetForm").hidden=true; $("#authForm").hidden=false; $("#guestBtn").hidden=false; if(session) startSynced(); }
});

/* ---------- файл с картами ---------- */
function exportCards(){
  const blob=new Blob([JSON.stringify({app:"keshbeker",version:1,exportedAt:new Date().toISOString(),cards:allCards},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="keshbeker-cards.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importCards(file){
  try{
    const j=JSON.parse(await file.text()); const list=Array.isArray(j)?j:j.cards;
    if(!Array.isArray(list)) throw new Error("bad");
    let n=0;
    for(const raw of list){
      if(!raw||!raw.id) continue;
      const c={...raw}; putCard(c); await store?.save(c);
      if(c.id!==LOOSE_ID && !c.deletedAt) n++;
    }
    render(); toast("Загружено карт: "+n);
  }catch{ toast("Не получилось прочитать файл"); }
}

setAuthMode("in");
if(!window.supabase || !CFG.url || !CFG.key){
  if(lsGet(GUEST)==="1") startGuest(); else showGate(true);
  authMsg(!window.supabase ? "Не загрузилась библиотека входа. Проверь интернет или включи VPN и обнови страницу." : "Сайт ещё не подключён к базе. Заполни config.js.","err");
} else {
  sb=window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let started=false;
  sb.auth.onAuthStateChange((event, sess)=>{
    session=sess;
    if(event==="PASSWORD_RECOVERY"){ showGate(true); $("#authForm").hidden=true; $("#resetForm").hidden=false; $("#guestBtn").hidden=true; return; }
    if(sess && !started && $("#resetForm").hidden){ started=true; setTimeout(()=>{
      if(lsGet(GUEST)==="1") pendingMerge=(readLS()||[]).slice(); else setAll(readLS()||[]);
      startSynced(); },0); }
    if(!sess) started=false;
  });
  sb.auth.getSession().then(({data})=>{
    if(!data.session){ if(lsGet(GUEST)==="1") startGuest(); else showGate(true); }
  });
}
})();
</script>

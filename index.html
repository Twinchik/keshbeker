<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кешбекер</title>
<meta name="description" content="Кошелёк банковских карт с кешбеком по категориям">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кешбекер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8ebf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="splash" role="status" aria-label="Загрузка">
  <div class="sp-stage"><div class="sp-card"><i class="sp-chip"></i><i class="sp-line"></i><b class="sp-pct">%</b></div><div class="sp-shadow"></div></div>
  <div class="sp-name">Кешбекер</div>
  <div class="sp-sub">Достаю карты…</div>
</div>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Кешбекер</h1><span id="monthLbl"></span></div>
    <div class="hdr-r"><button class="btn primary" id="addBtn" type="button"><span aria-hidden="true">+</span> Карта</button><button class="avatar" id="acctBtn" type="button" aria-label="Аккаунт" hidden></button></div>
  </header>

  <section class="gate" id="gate" hidden>
    <div class="gate-cards" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2>Все кешбеки в одном кошельке</h2>
    <p id="gateText">Войди, и твои карты будут на всех устройствах: на айфоне и на компьютере.</p>
    <form class="auth" id="authForm" autocomplete="on">
      <div class="seg" role="tablist" id="authTabs"><button type="button" role="tab" data-mode="in" aria-selected="true">Вход</button><button type="button" role="tab" data-mode="up" aria-selected="false">Регистрация</button></div>
      <input class="in" id="authEmail" type="email" autocomplete="email" required placeholder="Почта" aria-label="Почта">
      <input class="in" id="authPass" type="password" autocomplete="current-password" required minlength="6" placeholder="Пароль" aria-label="Пароль">
      <input class="in" id="authPass2" type="password" autocomplete="new-password" minlength="6" placeholder="Повтори пароль" aria-label="Повтори пароль" hidden>
      <button class="btn primary" id="authSubmit" type="submit">Войти</button>
      <p class="auth-msg" id="authMsg" role="status"></p>
      <button class="alt" type="button" id="forgotBtn">Забыл пароль</button>
    </form>
    <form class="auth" id="resetForm" hidden>
      <p>Придумай новый пароль</p>
      <input class="in" id="newPass" type="password" autocomplete="new-password" required minlength="6" placeholder="Новый пароль" aria-label="Новый пароль">
      <button class="btn primary" type="submit">Сохранить пароль</button>
      <p class="auth-msg" id="resetMsg" role="status"></p>
    </form>
    <button class="alt" type="button" id="guestBtn">Продолжить без входа</button>
  </section>
  <div id="main" style="display:contents">
  <nav class="tabs" role="tablist" id="viewTabs" aria-label="Разделы"><button type="button" role="tab" data-view="cards" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>Карты</button><button type="button" role="tab" data-view="shops" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5c0 1.4 1.2 2.5 2.7 2.5s2.6-1.1 2.6-2.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5M10 20v-5h4v5"/></svg>Магазины</button></nav>
  <div id="cardsView" style="display:contents">
  <section class="search" aria-label="Поиск кешбека">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" placeholder="Какой кешбек нужен? Такси, аптека, Пятёрочка…" aria-label="Категория или магазин">
      <button id="qClear" type="button" aria-label="Очистить" hidden>×</button>
      <ul class="suggest" id="suggest" role="listbox" aria-label="Подсказки" hidden></ul>
    </div>
    <div class="chips" id="chips"></div>
    <div id="answerBox"></div>
  </section>

  <div class="wallet" id="wallet" aria-label="Карты"></div>
  <div id="detail"></div>
  </div>
  <section id="shopsView" class="shops" hidden>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="shopQ" class="q2" type="search" autocomplete="off" placeholder="Найти магазин" aria-label="Найти магазин">
    </div>
    <ul class="shoplist" id="shopList"></ul>
  </section>
  <button type="button" class="trash-link" id="trashBtn" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Корзина <b id="trashCount">0</b></button>
  <p class="status" id="status"></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/wallet.js"></script>
<script src="js/photo.js"></script>
<script src="js/shops.js"></script>
<script src="js/editor.js"></script>
<script src="js/account.js"></script>

</body>
</html>

# Положи этот файл в репозиторий Кешбекера по пути:
#   .github/workflows/supabase-keep-alive.yml
# Каждый день делает запрос к базе, чтобы бесплатный Supabase не уходил на паузу.

name: Supabase keep-alive

on:
  schedule:
    - cron: "18 6 * * *"   # каждый день в 09:17 по Москве
  workflow_dispatch:        # кнопка ручного запуска во вкладке Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Не заданы секреты SUPABASE_URL и/или SUPABASE_KEY"
            exit 1
          fi

          for attempt in 1 2 3; do
            code=$(curl -s -o response.txt -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY")
            echo "Попытка $attempt: HTTP $code"
            cat response.txt; echo
            if [ "$code" = "200" ]; then
              echo "Supabase активен ✅"
              exit 0
            fi
            sleep 20
          done

          echo "Supabase не ответил — возможно, проект уже на паузе. Зайди в дашборд и нажми Resume."
          exit 1
